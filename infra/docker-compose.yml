version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: casevault_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-casevault}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-casevault}
      POSTGRES_DB: ${POSTGRES_DB:-casevault}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-casevault} -d ${POSTGRES_DB:-casevault}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: casevault_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-casevault}:${POSTGRES_PASSWORD:-casevault}@postgres:5432/${POSTGRES_DB:-casevault}
      # SECURITY: Override SECRET_KEY with a strong random value in production.
      # Generate: python -c "import secrets; print(secrets.token_hex(32))"
      SECRET_KEY: ${SECRET_KEY:-change-me-before-production}
      DEBUG: ${DEBUG:-false}
      LLM_API_KEY: ${LLM_API_KEY:-}
      # SECURITY: Set to false in production to disable /docs and /redoc
      DOCS_ENABLED: ${DOCS_ENABLED:-true}
      # SECURITY: Set to your frontend domain in production
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # NOTE: This mount is for development only. Remove in production
      # to prevent source-code exposure.
      - ../backend:/app
    # Resource limits (uncomment and tune for production):
    # deploy:
    #   resources:
    #     limits:
    #       cpus: "2.0"
    #       memory: 2G
    #     reservations:
    #       cpus: "0.5"
    #       memory: 512M

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: casevault_frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
    driver: local
